# Self-contained guinea pig for end-to-end validation of the RedAmon
# serialized_scan recon module + the agent deserialization built-in skill.
#
#   docker compose up -d --build
#   curl -s http://172.25.0.92/            # landing page links every endpoint
#
# Pin a RedAmon recon project (IP mode) at 172.25.0.92. A fixed high host on the
# RedAmon network survives lab restarts (auto-assigned IPs drift and silently
# repoint a pinned scan at a dead address). Scan containers run --net=host and
# cannot resolve container-name DNS, so target the IP, not the name. 172.25.0.92
# stays clear of web-cache-poisoning's 172.25.0.90.

services:
  serialized-target:
    build:
      context: .
      dockerfile: Dockerfile
    image: redamon-serialized-target:latest
    container_name: redamon-serialized-target
    restart: unless-stopped
    ports:
      - "9092:80"   # host alias for manual curl; recon uses the bridge IP:80
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket,sys; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 80)); s.close()\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      redamon:
        ipv4_address: 172.25.0.92

networks:
  redamon:
    external: true
    name: redamon-network
